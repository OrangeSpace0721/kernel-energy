[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kernelenergy"
version = "0.1.0"
description = "Kernel-level energy measurement and prediction for diffusion models, after PipeWeave (Zhang et al., ISCA 2026)"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "nvidia-ml-py>=12.535",
]

[project.optional-dependencies]
# Only needed on the GPU boxes that run capture + replay.
gpu = [
    "torch>=2.4",
    "diffusers>=0.32",
    "transformers>=4.45",
    "accelerate>=1.0",
    "sentencepiece",
    "protobuf",
]
dev = ["pytest>=7.4"]

[project.scripts]
kernelenergy = "kernelenergy.cli:main"

[tool.setuptools.packages.find]
include = ["kernelenergy*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
